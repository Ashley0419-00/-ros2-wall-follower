name: Static checks

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Check repository hygiene
        run: |
          test -z "$(find . -type d -name __pycache__ -print -quit)"
          test -z "$(find . -type f \( -name '*.pyc' -o -name '*.sdf~' \) -print -quit)"
      - name: Compile Python sources
        run: python -m py_compile scripts/*.py wall_follower/*.py launch/*.py
      - name: Parse ROS package manifest
        run: python -c "import xml.etree.ElementTree as ET; ET.parse('package.xml')"
